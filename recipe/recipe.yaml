context:
  name: wigglystuff
  version: "0.5.33"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b7413ba28fa699e07b6a28eb70c61a5d011ca32cb29f151697aa9094d5141c2f

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - anywidget >=0.11.0
    - drawdata

tests:
  - python:
      imports:
        - wigglystuff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://koaning.github.io/wigglystuff/
  summary: 'A collection of creative AnyWidgets for Python notebook environments.'
  description: |
    The project uses anywidget under the hood so our tools should work in Jupyter, Shiny for Python, VSCode, Colab, Solara and Marimo. Because of the anywidget integration you should also be able interact with ipywidgets natively.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/koaning/wigglystuff

extra:
  recipe-maintainers:
    - claudiushaag
